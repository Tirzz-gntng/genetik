name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

      asset_name:
        description: "Source asset name"
        required: false
        default: ""
        type: string

      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK tools
        shell: bash
        run: |
          sdkmanager "platform-tools"

      - name: Verify Android project
        shell: bash
        run: |
          test -f android/gradlew
          test -f android/settings.gradle || \
          test -f android/settings.gradle.kts

          chmod +x android/gradlew

          echo "Android project found:"
          ls -la android/

      - name: Build Debug
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
