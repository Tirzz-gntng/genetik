name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama build"
        required: true
        type: string
        default: "android-build"

      asset_name:
        description: "Nama ZIP source Android di repository"
        required: true
        type: string
        default: "source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # =========================================
      # JAVA 17
      # =========================================
      # Sengaja TIDAK menggunakan cache: gradle
      # karena ZIP Android belum diekstrak pada tahap ini.
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================
      # ANDROID SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true

      # =========================================
      # ACCEPT LICENSES
      # =========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/dev/null 2>&1

          exit 0

      # =========================================
      # BUILD INFORMATION
      # =========================================
      - name: Build information
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID APK BUILD"
          echo "=========================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Build      : ${{ inputs.release_tag }}"
          echo "ZIP        : ${{ inputs.asset_name }}"
          echo "=========================================="

      # =========================================
      # CHECK ZIP
      # =========================================
      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ inputs.asset_name }}"

          echo "Mencari:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP tidak ditemukan."
            echo ""
            echo "File yang tersedia:"
            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./.git/*" \
              | sort

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

      # =========================================
      # EXTRACT ZIP
      # =========================================
      - name: Extract Android source
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ inputs.asset_name }}"

          rm -rf android-source
          mkdir -p android-source

          unzip -q "$ZIP_FILE" -d android-source

          echo "=========================================="
          echo "HASIL EXTRACT"
          echo "=========================================="

          find android-source \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # =========================================
      # FIND GRADLE PROJECT
      # =========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Mencari gradlew..."

          GRADLEW=$(find android-source \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
            echo ""
            echo "File project:"
            find android-source \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

         
