name: Build Genetik APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag GitHub Release yang berisi ZIP build"
        required: true
        type: string

      asset_name:
        description: "Nama asset ZIP yang akan dibuild"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -e

          mkdir -p /tmp/input /tmp/project

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir /tmp/input

          unzip -q "/tmp/input/$ASSET_NAME" -d /tmp/project

      - name: Find Gradle project
        run: |
          set -e

          PROJECT_DIR="$(find /tmp/project -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP tidak berisi gradlew."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Find APK
        run: |
          mkdir -p artifact

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} artifact/ \;

          ls -lah artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: genetik-release-apk
          path: artifact/*.apk
          if-no-files-found: error
