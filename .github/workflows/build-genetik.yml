name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"

      - name: Verify Android project
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
          elif find . -name "gradlew" -type f -print -quit | grep -q .; then
            echo "Gradle wrapper found in project subdirectory."
          else
            echo "::error::No gradlew file found."
            echo "The repository does not appear to contain a standard Gradle Android project."
            exit 1
          fi

      - name: Make Gradle executable
        shell: bash
        run: |
          GRADLEW="$(find . -name gradlew -type f -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          chmod +x "$GRADLEW"

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        shell: bash
        run: |
          GRADLEW="$(find . -name gradlew -type f -print -quit)"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: inputs.build_type == 'release'
        shell: bash
        run: |
          GRADLEW="$(find . -name gradlew -type f -print -quit)"
          PROJECT_DIR="$(dirname "$GRADLEW")"

          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          mkdir -p output

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./output/*" \
            -exec cp {} output/ \;

          echo "APK files:"
          find output -type f -name "*.apk" -print

          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "::error::No APK was generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/*.apk
          if-no-files-found: error
