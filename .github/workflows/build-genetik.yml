name: Build Genetik APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the Android source ZIP"
        required: true
        type: string
      asset_name:
        description: "Source ZIP filename"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          exit 0

      - name: Download source ZIP from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p source

          gh release download "${{ inputs.release_tag }}"             --repo "$GITHUB_REPOSITORY"             --pattern "${{ inputs.asset_name }}"             --dir source

          test -f "source/${{ inputs.asset_name }}" || {
            echo "ERROR: Release asset not found."
            ls -lah source
            exit 1
          }

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -q "source/${{ inputs.asset_name }}" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find android-project -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The supplied ZIP must contain a real Android Gradle project."
            find android-project -maxdepth 6 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Check Gradle project
        shell: bash
        run: |
          set -e
          test -x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" --version

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease             --no-daemon             --stacktrace             --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e
          mkdir -p output

          APK="$(find "$PROJECT_DIR"             -type f             -name '*.apk'             -path '*/build/outputs/*'             -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          cp "$APK" output/genetik-release.apk
          ls -lh output/genetik-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetik-release-apk
          path: output/genetik-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Android APK Build"
            echo ""
            echo "**Release:** ${{ inputs.release_tag }}"
            echo ""
            echo "**Source:** ${{ inputs.asset_name }}"
            echo ""
            if [ -d output ]; then
              echo "## Output"
              ls -lh output/
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
