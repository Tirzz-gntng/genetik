name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "17"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show project structure
        shell: bash
        run: |
          echo "===== PROJECT ROOT ====="
          pwd
          echo
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          echo "Android SDK licenses processed."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "tools"

          echo "Android SDK packages installed."

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found."
            echo "This repository does not appear to contain a Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "${{ steps.project.outputs.gradlew }}"

      - name: Verify Gradle project
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

          echo
          echo "===== GRADLE TASKS ====="
          ./gradlew tasks --all --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'debug' }}
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK files
        id: apk
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "Found $COUNT APK file(s)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Android Build"
            echo
            echo "**Run:** ${{ github.run_number }}"
            echo
            echo "## APK files"
            echo
            find . -type f -name "*.apk" -print
          } >> "$GITHUB_STEP_SUMMARY"
