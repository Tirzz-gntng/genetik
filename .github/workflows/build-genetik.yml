name: Build Genetik APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag yang berisi ZIP input"
        required: true
        type: string
      asset_name:
        description: "Nama asset ZIP"
        required: true
        type: string
      job_id:
        description: "ID build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Genetik APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          mkdir -p /tmp/input
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$ASSET" \
            --dir /tmp/input
          test -f "/tmp/input/$ASSET"
          ls -lh "/tmp/input/$ASSET"

      - name: Extract project
        run: |
          mkdir -p /tmp/project
          unzip -q "/tmp/input/${{ inputs.asset_name }}" -d /tmp/project
          find /tmp/project -maxdepth 3 -type f | head -100

      - name: Locate Gradle wrapper
        id: locate
        run: |
          GRADLEW=$(find /tmp/project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          find /tmp/project -type f -name "*.apk" -exec cp {} artifact/ \;
          test -n "$(find artifact -type f -name '*.apk' -print -quit)"
          ls -lh artifact/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetik-apk
          path: artifact/*.apk
          if-no-files-found: error
          
