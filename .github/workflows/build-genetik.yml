name: Build Genetik

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: false
        type: string
        default: ""

      asset_name:
        description: "Asset name"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify Android project
        shell: bash
        run: |
          echo "=== Checking Android project ==="

          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort | head -200

          GRADLEW="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan."
            echo "::error::Repository bukan Gradle Android project yang lengkap."
            exit 1
          fi

          echo ""
          echo "Gradle wrapper ditemukan:"
          echo "$GRADLEW"

      - name: Prepare Gradle
        shell: bash
        run: |
          GRADLEW="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan."
            exit 1
          fi

          chmod +x "$GRADLEW"

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== Gradle files ==="
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] && \
             [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::settings.gradle atau settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "Gradle project OK."

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          rm -rf output
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/build/intermediates/*" \
            -exec cp {} output/ \;

          echo "=== Generated APK ==="
          ls -lh output/

          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "::error::APK tidak berhasil dibuat."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset_name != '' && inputs.asset_name || 'genetik-apk' }}
          path: output/*.apk
          if-no-files-found: error
