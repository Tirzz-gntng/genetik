name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama/tag build"
        required: false
        type: string
        default: "build"

      asset_name:
        description: "Nama file ZIP/input"
        required: false
        type: string
        default: "source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # 2. JAVA
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true

      # ==========================================
      # 4. ACCEPT LICENSE
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # ==========================================
      # 5. SHOW PROJECT
      # ==========================================
      - name: Inspect project
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD INFORMATION"
          echo "======================================"
          echo "Release tag : ${{ inputs.release_tag }}"
          echo "Asset name  : ${{ inputs.asset_name }}"
          echo "Repository  : $GITHUB_REPOSITORY"
          echo "Commit      : $GITHUB_SHA"
          echo "======================================"

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort | head -300

      # ==========================================
      # 6. CHECK GRADLE
      # ==========================================
      - name: Check Gradle project
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo ""
            echo "Project harus berupa project Android Gradle."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ls -lah ./gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ==========================================
      # 7. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon --stacktrace

      # ==========================================
      # 8. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ==========================================
      # 9. FIND APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      # ==========================================
      # 10. RENAME APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          cp "$APK" "output/${{ inputs.release_tag }}.apk"

          echo ""
          echo "Output:"
          ls -lah output/

      # ==========================================
      # 11. UPLOAD ARTIFACT
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # 12. BUILD SUMMARY
      # ==========================================
      - name: Build summary
        shell: bash
        run: |
          echo "## APK Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Input: ${{ inputs.asset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated APK:" >> "$GITHUB_STEP_SUMMARY"
          ls -lh output/*.apk >> "$GITHUB_STEP_SUMMARY"
