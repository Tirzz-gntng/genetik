name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama/tag build"
        required: true
        type: string
        default: "build"

      asset_name:
        description: "Nama file ZIP"
        required: true
        type: string
        default: "source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true

      # ==========================================
      # ACCEPT SDK LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          exit 0

      # ==========================================
      # BUILD INFORMATION
      # ==========================================
      - name: Show build information
        shell: bash
        run: |
          echo "======================================"
          echo "ANDROID BUILD"
          echo "======================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Release    : ${{ inputs.release_tag }}"
          echo "Asset      : ${{ inputs.asset_name }}"
          echo "======================================"

      # ==========================================
      # CHECK ANDROID PROJECT
      # ==========================================
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Mencari Gradle wrapper..."

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew tidak ditemukan."
            echo ""
            echo "Isi repository:"
            find . \
              -maxdepth 3 \
              -type f \
              -not -path "./.git/*" \
              | sort | head -300
            exit 1
          fi

          echo "Gradle wrapper ditemukan:"
          echo "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo ""
          echo "Permission:"
          ls -lah "$GRADLEW"

          echo ""
          echo "Gradle version:"
          "$GRADLEW" --version

      # ==========================================
      # GRADLE CLEAN
      # ==========================================
      - name: Gradle clean
        shell: bash
        run: |
          set -e

          chmod +x "$PROJECT_DIR/gradlew"

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x "$PROJECT_DIR/gradlew"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK HASIL BUILD"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # PREPARE OUTPUT
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp "$APK" \
            "output/${{ inputs.release_tag }}.apk"

          echo "======================================"
          echo "OUTPUT"
          echo "======================================"

          ls -lah output/

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "# Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Input:** ${{ inputs.asset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d output ]; then
            echo "## APK" >> "$GITHUB_STEP_SUMMARY"
            ls -lh output/ >> "$GITHUB_STEP_SUMMARY"
          fi
