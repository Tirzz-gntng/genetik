name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama/tag build"
        required: true
        type: string
        default: "build"

      asset_name:
        description: "Nama file ZIP"
        required: true
        type: string
        default: "source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ==========================================
      # JAVA
      # ==========================================
      # JANGAN gunakan cache: gradle di sini.
      # Repository utama hanya berisi workflow.
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          accept-android-sdk-licenses: true

      # ==========================================
      # SDK LICENSE
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          exit 0

      # ==========================================
      # INFORMASI BUILD
      # ==========================================
      - name: Build information
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID BUILD"
          echo "=========================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Release    : ${{ inputs.release_tag }}"
          echo "Asset      : ${{ inputs.asset_name }}"
          echo "=========================================="

      # ==========================================
      # CEK REPOSITORY
      # ==========================================
      - name: Inspect repository
        shell: bash
        run: |
          echo "Isi repository:"
          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort | head -300

      # ==========================================
      # CEK GRADLE PROJECT
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Mencari Gradle project..."

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew tidak ditemukan."
            echo ""
            echo "Repository ini tidak memiliki Android Gradle project."
            echo ""
            echo "Jika source Android berada di ZIP, ZIP tersebut harus"
            echo "diekstrak terlebih dahulu sebelum langkah Gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo ""
          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Gradle:"
          "$GRADLEW" --version

      # ==========================================
      # GRADLE CLEAN
      # ==========================================
      - name: Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # CARI APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK HASIL BUILD"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # SIAPKAN OUTPUT
      # ==========================================
      - name: Prepare output
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp "$APK_PATH" \
            "output/${{ inputs.release_tag }}.apk"

          ls -lah output/

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "# Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Asset:** ${{ inputs.asset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d output ]; then
            echo "## APK" >> "$GITHUB_STEP_SUMMARY"
            ls -lh output/ >> "$GITHUB_STEP_SUMMARY"
          fi
